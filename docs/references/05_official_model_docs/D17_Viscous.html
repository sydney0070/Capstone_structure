<h2 class="heading2">Viscous Material</h2>
<p class="bodytext">This command is used to construct a uniaxial material object with a non-linear elastic stress-strain-rate relation given by:</p>
<p class="bodytext">stress =C(strain-rate)<sup class="superscript">alpha</sup>.</p>
<p class="tableheading">uniaxialMaterial Viscous $matTag $C $alpha</p>
<p class="tablebodytext"></p>
<table width="585" cellpadding="2" cellspacing="0" border="0" style="border-collapse:collapse">
<tr align="left" valign="top">
<td width="151"><p class="tablebodytext"><strong class="specialbold">$matTag</strong></p>
</td>
<td width="434"><p class="tablebodytext">unique material object integer tag</p>
</td>
</tr>
<tr align="left" valign="top">
<td width="151"><p class="tablebodytext"><strong class="specialbold">$C</strong></p>
</td>
<td width="434"><p class="tablebodytext">tangent</p>
</td>
</tr>
<tr align="left" valign="top">
<td width="151"><p class="tablebodytext"><strong class="specialbold">$alpha</strong></p>
</td>
<td width="434"><p class="tablebodytext">damping tangent</p>
</td>
</tr>

</table>
